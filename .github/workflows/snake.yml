name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Anish974
          outputs: |
            dist/github-snake.svg?color_snake=%23ff0033&color_dots=#ebedf0,#ffcdd2,#e57373,#ef5350,#b71c1c
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23ff0033&color_dots=#161b22,#4c0612,#8c0d22,#d31238,#ff1744
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
